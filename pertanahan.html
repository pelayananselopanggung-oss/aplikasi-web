<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Menu Pertanahan</title>

    <link
        rel="stylesheet"
        href="bootstrap/css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        rel="stylesheet"
        href="css/pertanahan.css">

</head>

<body>

<!--====================================================
HEADER
=====================================================-->

<div class="header">

    <div class="container">

        <div class="text-center">

            <div class="header-icon">

                <i class="fa-solid fa-map-marked-alt"></i>

            </div>

            <h2>

                PERTANAHAN

            </h2>

            <p>

                Pelayanan Administrasi Pertanahan Desa

            </p>

            <div class="operator">

                <i class="fa-solid fa-user"></i>

                Operator :

                <strong id="namaOperator"></strong>

            </div>

        </div>

    </div>

</div>


<!--====================================================
MENU
=====================================================-->

<div class="container mt-4">

    <div class="row g-4">

        <!-- WARIS -->

        <div class="col-lg-4 col-md-6">

            <div
                class="card menu-card"
                id="menuWaris">

                <div class="card-body">

                    <div class="icon waris">

                        <i class="fa-solid fa-users"></i>

                    </div>

                    <h5>

                        Keterangan Waris

                    </h5>

                    <p>

                        Surat Keterangan Waris

                    </p>

                </div>

            </div>

        </div>


        <!-- HARGA TANAH -->

        <div class="col-lg-4 col-md-6">

            <div
                class="card menu-card"
                id="menuHargaTanah">

                <div class="card-body">

                    <div class="icon harga">

                        <i class="fa-solid fa-money-bill-wave"></i>

                    </div>

                    <h5>

                        Harga Tanah

                    </h5>

                    <p>

                        Surat Keterangan Harga Tanah

                    </p>

                </div>

            </div>

        </div>


        <!-- KEPEMILIKAN -->

        <div class="col-lg-4 col-md-6">

            <div
                class="card menu-card"
                id="menuKepemilikanTanah">

                <div class="card-body">

                    <div class="icon tanah">

                        <i class="fa-solid fa-house"></i>

                    </div>

                    <h5>

                        Kepemilikan Tanah

                    </h5>

                    <p>

                        Surat Keterangan Kepemilikan Tanah

                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- INFORMASI -->

    <div class="row mt-4">

        <div class="col-12">

            <div class="info-box">

                <i class="fa-solid fa-circle-info"></i>

                Modul pertanahan akan terus dikembangkan dengan jenis surat baru.

            </div>

        </div>

    </div>


    <!-- KEMBALI -->

    <div class="text-center mt-4 mb-4">

        <button
            id="menuKembali"
            class="btn btn-kembali">

            <i class="fa-solid fa-arrow-left"></i>

            Kembali

        </button>

    </div>

</div>


<script src="bootstrap/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>

<script src="js/pertanahan.js"></script>

</body>

</html>
