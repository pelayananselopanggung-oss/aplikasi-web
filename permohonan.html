<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Permohonan Surat</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#198754">

<link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/permohonan.css">

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-success shadow">

<div class="container-fluid">

<button
class="btn btn-light"
onclick="dashboard()">

<i class="fa fa-home"></i>

</button>

<span class="navbar-brand mx-auto">

PERMOHONAN SURAT

</span>

</div>

</nav>

<!-- ================= PENCARIAN ================= -->

<div class="container mt-3">

<div class="card shadow">

<div class="card-body">

<div class="row g-2">

<div class="col-md-9">

<input
type="text"
id="txtCari"
class="form-control form-control-lg"
placeholder="Masukkan NIK/Nama atau untuk SKTM Siswa masukan NIk/Nama Siswa">

</div>

<div class="col-md-3 d-grid">

<button
class="btn btn-success btn-lg"
onclick="cariPenduduk()">

<i class="fa fa-search"></i>

Cari

</button>

</div>

</div>

</div>

</div>

</div>

<!-- ================= STATUS ================= -->

<div class="container mt-3">

<div
id="statusArea"
class="alert alert-info text-center">

Masukkan NIK/Nama atau untuk SKTM Siswa masukan NIk/Nama Siswa.

</div>

</div>

<!-- ================= HASIL ================= -->

<div class="container">

<div id="hasilCari">

</div>

</div>

<!-- ================= MENU ================= -->

<div class="container my-4">

<div class="row g-3">

<div class="col-md-6 d-grid">

<button
id="btnTambah"
class="btn btn-primary btn-lg"
style="display:none"
onclick="tambahPenduduk()">

<i class="fa fa-user-plus"></i>

Tambah Penduduk Baru

</button>

</div>

<div class="col-md-6 d-grid">

<button
id="btnLuar"
class="btn btn-warning btn-lg"
style="display:none"
onclick="pemohonLuar()">

<i class="fa fa-earth-asia"></i>

Pemohon Luar Daerah

</button>

</div>

</div>

</div>

<!-- ================= LOADING ================= -->

<div
id="loading"
class="loading"
style="display:none;">

<div class="spinner-border text-success">

</div>

</div>

<!-- ================= SCRIPT ================= -->

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>
<script src="js/offline/db.js"></script>
<script src="js/permohonan.js"></script>


</body>
</html>
