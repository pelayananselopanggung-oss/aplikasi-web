<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"

        </div>

        <br>

        <!--==========================================
            JUDUL
        ==========================================-->

        <div class="judul">

            FORMULIR SURAT IZIN ORANG TUA

        </div>

        <div class="model">

            Model N5

        </div>

        <br>

                    <b>

                        <u id="ttdAyah"></u>

                    </b>

                </td>

                <td
                    style="width:50%"
                    class="text-center">

                    <div id="tanggalIbu"></div>

                    <br>

                    Ibu

                    <br><br><br><br><br>

                    <b>

                        <u id="ttdIbu"></u>

                    </b>

            </tr>

        </table>

    ==============================================-->

    <div class="qr">

        <img
            id="qrCode"
            width="110">

        <div>

            Scan Verifikasi

        </div>

    </div>

    <!--==============================================
        TOOLBAR
    ==============================================-->

    <div class="toolbar no-print">

        <button onclick="window.print()">

            Cetak

        </button>

        <button onclick="kembali()">

            Kembali

        </button>

    </div>

    <!--==============================================
        SCRIPT
    ==============================================-->

    <script src="js/config.js"></script>
