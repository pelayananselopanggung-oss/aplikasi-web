<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Surat Keterangan Domisili</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#198754">

<link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/domisili.css">

</head>

<body>

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-success shadow">

<div class="container-fluid">

<button
class="btn btn-light"
onclick="kembali()">

<i class="fa fa-arrow-left"></i>

</button>

<span class="navbar-brand mx-auto">

SURAT KETERANGAN DOMISILI

</span>

</div>

</nav>

<!-- DATA PEMOHON -->

<div class="container mt-3">

<div class="card shadow">

<div class="card-header bg-success text-white">

<b>IDENTITAS PEMOHON</b>

</div>

<div class="card-body">

<div class="row">

<!-- NIK -->

<div class="col-md-6 mb-3">

<label class="form-label">

NIK

</label>

<input
type="text"
id="nik"
class="form-control"
readonly>

</div>

<!-- NAMA -->

<div class="col-md-6 mb-3">

<label class="form-label">

Nama Lengkap

</label>

<input
type="text"
id="nama"
class="form-control">

</div>

<!-- TEMPAT LAHIR -->

<div class="col-md-6 mb-3">

<label class="form-label">

Tempat Lahir

</label>

<input
type="text"
id="tempatlahir"
class="form-control">

</div>

<!-- TANGGAL LAHIR -->

<div class="col-md-6 mb-3">

<label class="form-label">

Tanggal Lahir

</label>

<input
type="date"
id="tanggallahir"
class="form-control">

</div>

<!-- JK -->

<div class="col-md-6 mb-3">

<label class="form-label">

Jenis Kelamin

</label>

<select
id="jk"
class="form-select">

<option value="">Pilih</option>

<option>Laki-Laki</option>

<option>Perempuan</option>

</select>

</div>

<!-- AGAMA -->

<div class="col-md-6 mb-3">

<label class="form-label">

Agama

</label>

<select
id="agama"
class="form-select">

<option value="">Pilih</option>

<option>Islam</option>
<option>Kristen</option>
<option>Katolik</option>
<option>Hindu</option>
<option>Buddha</option>
<option>Konghucu</option>

</select>

</div>

<!-- PEKERJAAN -->

<div class="col-md-6 mb-3">

<label class="form-label">

Pekerjaan

</label>

<input
type="text"
id="pekerjaan"
class="form-control">

</div>

<!-- STATUS -->

<div class="col-md-6 mb-3">

<label class="form-label">

Status Perkawinan

</label>

<select
id="sp"
class="form-select">

<option value="">Pilih</option>

<option>Belum Kawin</option>

<option>Kawin</option>

<option>Cerai Hidup</option>

<option>Cerai Mati</option>

</select>

</div>

</div>

</div>

</div>

</div>


<!-- ALAMAT ASAL -->

<div class="container mt-3">

<div class="card shadow">

<div class="card-header bg-primary text-white">

<b>ALAMAT ASAL</b>

</div>

<div class="card-body">

<div class="row">

<!-- ALAMAT -->

<div class="col-12 mb-3">

<label class="form-label">

Alamat

</label>

<textarea
id="alamat"
class="form-control"
rows="3"></textarea>

</div>

<!-- RT -->

<div class="col-md-2 mb-3">

<label class="form-label">

RT

</label>

<input
type="number"
id="rt"
class="form-control">

</div>

<!-- RW -->

<div class="col-md-2 mb-3">

<label class="form-label">

RW

</label>

<input
type="number"
id="rw"
class="form-control">

</div>

<!-- DESA -->

<div class="col-md-4 mb-3">

<label class="form-label">

Desa / Kelurahan

</label>

<input
type="text"
id="desa"
class="form-control">

</div>

<!-- KECAMATAN -->

<div class="col-md-4 mb-3">

<label class="form-label">

Kecamatan

</label>

<input
type="text"
id="kecamatan"
class="form-control">

</div>

<!-- KABUPATEN -->

<div class="col-md-6 mb-3">

<label class="form-label">

Kabupaten / Kota

</label>

<input
type="text"
id="kabupaten"
class="form-control">

</div>

<!-- PROVINSI -->

<div class="col-md-6 mb-3">

<label class="form-label">

Provinsi

</label>

<input
type="text"
id="provinsi"
class="form-control">

</div>

</div>

</div>

</div>

</div>


<!-- DOMISILI SEKARANG -->

<div class="container mt-3">

<div class="card shadow">

<div class="card-header bg-warning">

<b>DOMISILI SEKARANG</b>

</div>

<div class="card-body">

<div class="mb-3">

<label class="form-label">

Bertempat Tinggal di

</label>

<textarea
id="bertempat"
class="form-control"
rows="4"
placeholder="Contoh : Dusun Selopanggung RT 003 RW 001 Desa Selopanggung Kecamatan Semen Kabupaten Kediri"></textarea>

</div>

<div class="mb-3">

<label class="form-label">

Keperluan

</label>

<textarea
id="keperluan"
class="form-control"
rows="3"
placeholder="Contoh : Persyaratan administrasi sekolah"></textarea>

</div>

</div>

</div>

</div>


<!-- TOMBOL -->

<div class="container mt-4 mb-5">

<div class="row">

<div class="col-md-4 mb-2">

<button
class="btn btn-secondary w-100"
onclick="kembali()">

<i class="fa fa-arrow-left"></i>

Kembali

</button>

</div>

<div class="col-md-4 mb-2">

<button
class="btn btn-warning w-100"
onclick="resetForm()">

<i class="fa fa-rotate-left"></i>

Reset

</button>

</div>

<div class="col-md-4 mb-2">

<button
class="btn btn-success w-100"
onclick="previewSurat()">

<i class="fa fa-file-lines"></i>

Preview Surat

</button>

</div>

</div>

</div>


<!-- LOADING -->

<div
id="loading"
class="loading"
style="display:none;">

<div class="spinner-border text-success">

</div>

</div>


<!-- BOOTSTRAP -->

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- CONFIG -->

<script src="js/config.js"></script>

<!-- JAVASCRIPT -->
<script src="js/offline/db.js"></script>
<script src="js/domisili.js"></script>


</body>

</html>
