<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Surat Keterangan Ahli Waris</title>

    <link
        rel="stylesheet"
        href="bootstrap/css/bootstrap.min.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link
        rel="stylesheet"
        href="css/waris_tanah.css">

</head>

<body>

<!--==================================================
HEADER
===================================================-->

<div class="header">

    <div class="container">

        <h3>

            <i class="fa-solid fa-users"></i>

            SURAT KETERANGAN AHLI WARIS

        </h3>

        <div class="operator">

            Operator :

            <strong id="namaOperator"></strong>

        </div>

    </div>

</div>


<div class="container mt-4">

<!--==================================================
DATA PEWARIS
===================================================-->

<div class="card shadow-sm mb-4">

    <div class="card-header">

        <i class="fa-solid fa-user"></i>

        DATA PEWARIS

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-8 mb-3">

                <label class="form-label">

                    NIK Pewaris

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nik"
                    maxlength="16"
                    placeholder="Masukkan NIK">

            </div>

            <div class="col-md-4 mb-3 d-grid">

                <label>&nbsp;</label>

                <button
                    class="btn btn-primary"
                    id="btnCari">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    Cari Penduduk

                </button>

            </div>

        </div>


        <div class="row">

            <div class="col-md-8 mb-3">

                <label class="form-label">

                    Nama Pewaris

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nama">

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Tanggal Meninggal

                </label>

                <input
                    type="date"
                    class="form-control"
                    id="tanggalMeninggal">

            </div>

        </div>

    </div>

</div>



<!--==================================================
DATA PASANGAN
===================================================-->

<div class="card shadow-sm mb-4">

    <div class="card-header">

        <i class="fa-solid fa-heart"></i>

        DATA PASANGAN

    </div>

    <div class="card-body">

        <div class="mb-3">

            <label class="form-label">

                Nama Pasangan

            </label>

            <input
                type="text"
                class="form-control"
                id="pasangan">

        </div>

        <div class="mb-3">

            <label class="form-label">

                Status Pasangan

            </label>

            <br>

            <div class="form-check form-check-inline">

                <input
                    class="form-check-input"
                    type="radio"
                    name="statusPasangan"
                    id="statusHidup"
                    value="HIDUP"
                    checked>

                <label
                    class="form-check-label"
                    for="statusHidup">

                    Masih Hidup

                </label>

            </div>

            <div class="form-check form-check-inline">

                <input
                    class="form-check-input"
                    type="radio"
                    name="statusPasangan"
                    id="statusMeninggal"
                    value="MENINGGAL">

                <label
                    class="form-check-label"
                    for="statusMeninggal">

                    Sudah Meninggal

                </label>

            </div>

        </div>

        <div
            class="row"
            id="panelTahunMeninggal"
            style="display:none;">

            <div class="col-md-4">

                <label class="form-label">

                    Tahun Meninggal

                </label>

                <input
                    type="number"
                    class="form-control"
                    id="tahunMeninggal"
                    min="1900"
                    max="2100">

            </div>

        </div>

    </div>

</div>

<!--==================================================
DATA AHLI WARIS
===================================================-->

<div class="card shadow-sm mb-4">

    <div class="card-header d-flex justify-content-between align-items-center">

        <div>

            <i class="fa-solid fa-users"></i>

            DATA AHLI WARIS

        </div>

        <button
            type="button"
            class="btn btn-success btn-sm"
            id="btnTambahAhliWaris">

            <i class="fa-solid fa-plus"></i>

            Tambah

        </button>

    </div>

    <div class="card-body">

        <div class="table-responsive">

            <table
                class="table table-bordered table-hover align-middle"
                id="tabelAhliWaris">

                <thead class="table-light">

                    <tr>

                        <th
                            style="width:60px"
                            class="text-center">

                            No

                        </th>

                        <th>

                            Nama Ahli Waris

                        </th>

                        <th style="width:180px">

                            NIK

                        </th>

                        <th>

                            Tempat, Tanggal Lahir

                        </th>

                        <th>

                            Alamat

                        </th>

                        <th
                            style="width:90px"
                            class="text-center">

                            Aksi

                        </th>

                    </tr>

                </thead>

                <tbody id="bodyAhliWaris">

                    <tr>

                        <td
                            colspan="6"
                            class="text-center text-muted">

                            Belum ada data ahli waris.

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<!--==================================================
INPUT AHLI WARIS
===================================================-->

<div class="card shadow-sm mb-3">

    <div class="card-body">

        <div class="row">

            <div class="col-md-3 mb-3">

                <label class="form-label">

                    NIK

                </label>

                <div class="input-group">

                    <input
                        type="text"
                        class="form-control"
                        id="nikAhliWaris"
                        maxlength="16">

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="cariAhliWaris">

                        <i class="fa-solid fa-search"></i>

                    </button>

                </div>

            </div>

            <div class="col-md-5 mb-3">

                <label class="form-label">

                    Nama

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="namaAhliWaris">

            </div>

            <div class="col-md-4 mb-3">

                <label class="form-label">

                    Tempat, Tanggal Lahir

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="ttlAhliWaris">

            </div>

        </div>

        <div class="row">

            <div class="col-md-10 mb-3">

                <label class="form-label">

                    Alamat

                </label>

                <input
                    type="text"
                    class="form-control"
                    id="alamatAhliWaris">

            </div>

            <div class="col-md-2 d-grid">

                <label>&nbsp;</label>

                <button
                    class="btn btn-success"
                    id="tambahAhliWaris">

                    <i class="fa-solid fa-plus"></i>

                    Tambah

                </button>

            </div>

        </div>

    </div>

</div>


<!--==================================================
DATA HARTA WARISAN
===================================================-->

<div class="card shadow-sm mb-4">

    <div class="card-header">

        <i class="fa-solid fa-landmark"></i>

        DATA HARTA WARISAN

    </div>

    <div class="card-body">

        <div class="mb-3">

            <label class="form-label">

                Harta Warisan

            </label>

            <textarea
                class="form-control"
                id="hartaWarisan"
                rows="3"
                placeholder="Contoh : Sebidang tanah pekarangan yang terletak di Dusun ..., Persil ..., Luas ..., dan sebagainya."></textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">

                Identitas Harta Warisan

            </label>

            <textarea
                class="form-control"
                id="identitasWarisan"
                rows="5"
                placeholder="Tuliskan identitas lengkap harta warisan sesuai yang akan dicantumkan dalam surat."></textarea>

        </div>

    </div>

</div>


<!--==================================================
DATA SAKSI
===================================================-->

<div class="card shadow-sm mb-4">

    <div class="card-header">

        <i class="fa-solid fa-user-check"></i>

        DATA SAKSI

    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-lg-6">

                <h6 class="mb-3">

                    Saksi 1

                </h6>

                <div class="mb-3">

                    <label class="form-label">

                        Nama

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="namaSaksi1">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Umur

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="umurSaksi1">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Pekerjaan

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="pekerjaanSaksi1">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Alamat

                    </label>

                    <textarea
                        class="form-control"
                        id="alamatSaksi1"
                        rows="3"></textarea>

                </div>

            </div>


            <div class="col-lg-6">

                <h6 class="mb-3">

                    Saksi 2

                </h6>

                <div class="mb-3">

                    <label class="form-label">

                        Nama

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="namaSaksi2">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Umur

                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="umurSaksi2">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Pekerjaan

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="pekerjaanSaksi2">

                </div>

                <div class="mb-3">

                    <label class="form-label">

                        Alamat

                    </label>

                    <textarea
                        class="form-control"
                        id="alamatSaksi2"
                        rows="3"></textarea>

                </div>

            </div>

        </div>

    </div>

</div>


<!--==================================================
TOMBOL
===================================================-->

<div class="text-center mb-5">

    <button
        type="button"
        class="btn btn-secondary me-2"
        id="btnKembali">

        <i class="fa-solid fa-arrow-left"></i>

        Kembali

    </button>

    <button
        type="button"
        class="btn btn-primary"
        id="btnPreview">

        <i class="fa-solid fa-eye"></i>

        Preview

    </button>

</div>

</div>

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>

<script src="js/config.js"></script>

<script src="js/waris_tanah.js"></script>

</body>

</html>
