<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Cetak N1</title>

    <link
        rel="stylesheet"
        href="css/cetak_nikah.css">

</head>

<body>

    <!--==============================================
        HALAMAN CETAK
    ==============================================-->

    <div class="page">

        <!--==========================================
            LAMPIRAN
        ==========================================-->

        <div
            class="lampiran"
            id="lampiranSurat">

        </div>

        <br>

        <!--==========================================
            JUDUL
        ==========================================-->

        <div
            class="judul"
            id="judulSurat">

        </div>

        <div
            class="model"
            id="modelSurat">

        </div>

        <br>

        <!--==========================================
            HEADER SURAT
        ==========================================-->

        <div id="headerSurat">

        </div>

        <!--==========================================
            NOMOR SURAT
        ==========================================-->

        <div
            id="nomorSurat"
            class="nomor">

        </div>

        <br>

        <!--==========================================
            ISI SURAT
        ==========================================-->

        <div id="isiSurat">

        </div>

        <!--==========================================
            FOOTER / TTD
        ==========================================-->

        <div id="footerSurat">

        </div>

    </div>

    <!--==============================================
        QR VERIFIKASI
    ==============================================-->

    <div
        class="qr"
        id="areaQr">

        <img
            id="qrCode"
            width="110">

        <div>

            Scan Verifikasi

        </div>

    </div>

    <!--==============================================
        TOOLBAR
    ==============================================-->

    <div class="toolbar no-print">

        <button onclick="window.print()">

            Cetak

        </button>

        <button onclick="kembali()">

            Kembali

        </button>

    </div>

    <!--==============================================
        SCRIPT
    ==============================================-->

    <script src="js/config.js"></script>

    <script src="js/tandatangan.js"></script>
    <script src="js/preview_nikah.js"></script>
    <script src="js/cetak_nikah.js"></script>

</body>

</html>
